name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# A pull request that is pushed to twice should not queue behind its own stale run.
# A push to master must never be cancelled: release.yml publishes one build per green run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: python checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install CPU-only torch
        # The PyPI wheel for Linux carries the CUDA runtime (~450 MB download, ~2.5 GB
        # installed) that the unit tests never touch. Install the CPU build first, so the
        # resolver in the next step sees `torch` already satisfied.
        run: pip install --index-url https://download.pytorch.org/whl/cpu "torch~=2.14.0"
      - name: Install dependencies
        run: pip install -r requirements.txt -c constraints.txt -r requirements-dev.txt
      - name: Seed config from the tracked template (no secrets)
        run: cp config/config.ini.example config/config.ini
      - name: Repository gates
        run: |
          python scripts/check_agents_md.py
          python scripts/check_config_contract.py
          python scripts/check_hardcoded_timeframes.py
          python scripts/check_loose_helpers.py
          python scripts/check_dead_symbols.py
          python scripts/check_comment_policy.py
      - name: Lint
        run: ruff check src scripts start.py
      - name: Type check
        # pyrightconfig.json points at .venv; the runner has no .venv, so name the interpreter.
        run: python -m pyright --pythonpath "$(python -c 'import sys; print(sys.executable)')" src start.py
      - name: Deletion budget (refactor pull requests)
        if: github.event_name == 'pull_request'
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python scripts/check_net_diff.py --base "origin/${{ github.base_ref }}" --head HEAD --labels "$PR_LABELS" --title "$PR_TITLE"
      - name: Unit tests (no network, no browser, no API keys)
        run: pytest tests -q -m "not integration" --timeout=120 -p no:cacheprovider
