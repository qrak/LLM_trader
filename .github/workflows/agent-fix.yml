name: AI Agent Fix

# The "self-improving codebase" claim made real: label an issue or PR
# with `ai-fix` and Hermes Agent (the same AI that develops this bot
# interactively) investigates, implements the fix, and opens a PR.
#
# Requires a repository secret with your LLM provider key, e.g.:
#   DEEPSEEK_API_KEY  (default — matches the interactive setup)
# To use another provider, change `provider` / `model` below and add the
# matching secret (ANTHROPIC_API_KEY, OPENROUTER_API_KEY, ...).

on:
  issues:
    types: [labeled, unlabeled]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  agent-fix:
    if: github.event.label.name == 'ai-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install tooling
        run: |
          pip install ruff pytest pytest-asyncio

      - name: Install Hermes Agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          pip install hermes-agent
          hermes config set model.provider deepseek
          hermes config set model.default deepseek-v4-flash
          hermes config set approvals.mode off

      - name: Run Hermes Bugfixer
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            TARGET="${{ github.event.issue.number }}"
            URL="https://github.com/${{ github.repository }}/issues/$TARGET"
            KIND="issue"
          else
            TARGET="${{ github.event.pull_request.number }}"
            URL="https://github.com/${{ github.repository }}/pull/$TARGET"
            KIND="PR"
          fi

          BRANCH="ai-fix/$KIND-$TARGET-$(date +%s)"
          git checkout -b "$BRANCH"

          hermes chat -q "You are the Bugfixer agent of LLM_trader (this repo).
          First read .ai/bugfixing.md and AGENTS.md. Then investigate and fix
          the problem described in $KIND #$TARGET ($URL).
          Project rules: one bug per PR, minimal diff, add a regression test
          when feasible, run 'ruff check src/ tests/' and the test suite
          (pytest) before finishing, do NOT touch files outside the fix scope.
          Commit with a conventional message (fix: ...) and push the current
          branch. If the issue is not a real bug, do not create a fix —
          just say so in your final message." --yolo || true

      - name: Open PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="ai-fix/$([ "${{ github.event_name }}" = "issues" ] && echo "ISSUE" || echo "PR")-${{ github.event.issue.number || github.event.pull_request.number }}-*"
          LATEST=$(git ls-remote origin "$BRANCH" | head -1 | awk '{print $2}' | sed 's|refs/heads/||')
          if [ -n "$LATEST" ]; then
            gh pr create --base master --head "$LATEST" --title "🤖 AI Fix (Hermes)" --body "Automated fix by Hermes Agent (rules: .ai/bugfixing.md)." --label "ai-fix" || echo "PR already exists"
          else
            echo "No branch with changes — Hermes found nothing to fix."
          fi
